reverse-proxy:
  image: nginx:alpine
  container_name: reverse-proxy
  ports:
    - "80:80"
  volumes:
    - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./nginx/active.conf:/etc/nginx/conf.d/active.conf:ro
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - app-network
