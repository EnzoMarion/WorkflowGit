version: "3.9"

services:
  backend-blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-blue
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - app-network

  frontend-blue:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-blue
    env_file:
      - ./frontend/.env
    depends_on:
      - backend-blue
    expose:
      - "80"
    networks:
      - app-network

networks:
  app-network: {}
