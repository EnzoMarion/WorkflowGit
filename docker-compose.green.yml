version: "3.9"

services:
  backend-green:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-green
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - app-network

  frontend-green:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-green
    env_file:
      - ./frontend/.env
    depends_on:
      - backend-green
    expose:
      - "80"
    networks:
      - app-network

networks:
  app-network: {}
