name: CI

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ feature/cd-deployment ]

jobs:
  lint:
    name: Lint frontend & backend
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Lint backend
        working-directory: backend
        run: npm run lint

  build:
    name: Build frontend & backend
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Build backend
        working-directory: backend
        run: npm run build

  test:
    name: Backend tests
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Run tests
        working-directory: backend
        run: npm test

  sonar:
    name: SonarCloud analysis (backend)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Run tests with coverage
        working-directory: backend
        run: npm test -- --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            "-Dsonar.projectKey=EnzoMarion_WorkflowGit"
            "-Dsonar.organization=enzomarion"
            "-Dsonar.projectName=WorkflowGit"
            "-Dsonar.sources=backend/src"
            "-Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info"

  docker-images:
    name: Build & push Docker images
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Remove old healthcheck containers
        run: |
          $names = @("backend-ci", "frontend-ci")
          foreach ($name in $names) {
            $container = docker ps -a --format "{{.Names}}" | Select-String -SimpleMatch $name
            if ($container) {
              docker rm -f $name
            }
          }

      - name: Build backend image
        run: docker build -t backend-ci ./backend

      - name: Build frontend image
        run: docker build -t frontend-ci ./frontend

      - name: Run backend container (healthcheck)
        run: docker run -d --rm --name backend-ci -p 3000:3000 backend-ci

      - name: Run frontend container (healthcheck)
        run: docker run -d --rm --name frontend-ci -p 8080:80 frontend-ci

      - name: Healthcheck backend
        run: curl http://localhost:3000/health

      - name: Stop containers
        if: always()
        shell: pwsh
        run: |
          docker stop backend-ci 2>$null
          docker stop frontend-ci 2>$null
        continue-on-error: true

      - name: Tag backend image
        run: docker tag backend-ci ghcr.io/enzomarion/cloudnative-backend:${{ github.sha }}

      - name: Tag frontend image
        run: docker tag frontend-ci ghcr.io/enzomarion/cloudnative-frontend:${{ github.sha }}

      - name: Push backend image
        run: docker push ghcr.io/enzomarion/cloudnative-backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push ghcr.io/enzomarion/cloudnative-frontend:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: docker-images
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Prepare backend env file
        run: cp backend/.env.example backend/.env

      - name: Prepare frontend env file
        run: cp frontend/.env.example frontend/.env

      - name: Deploy stack via script
        run: powershell -File ./scripts/deploy.ps1 -Sha "${{ github.sha }}"

